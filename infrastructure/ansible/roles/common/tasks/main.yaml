---
- name: Verify base commands supplied by the Ubuntu cloud image
  ansible.builtin.command: "{{ item }}"
  changed_when: false
  loop:
    - curl --version
    - iptables --version
    - modprobe --version

- name: Load the br_netfilter kernel module at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      br_netfilter

- name: Load the br_netfilter kernel module now
  ansible.builtin.command: modprobe br_netfilter
  changed_when: false

- name: Configure kernel networking settings for Kubernetes
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-k3s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1

- name: Apply kernel networking settings for Kubernetes
  ansible.builtin.command: sysctl --system
  changed_when: false
