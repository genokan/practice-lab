name: Validate infrastructure and GitOps

on:
  pull_request:
    paths:
      - ".github/workflows/validate-infrastructure.yaml"
      - "bootstrap/**"
      - "charts/**"
      - "environments/**"
      - "infrastructure/**"
      - "platform/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Check formatting
        run: terraform -chdir=infrastructure/terraform fmt -check
      - name: Initialize without a backend
        run: terraform -chdir=infrastructure/terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform -chdir=infrastructure/terraform validate -no-color

  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validation tools
        run: >-
          python -m pip install --disable-pip-version-check
          ansible-core==2.21.3 ansible-lint==26.8.0 yamllint==1.38.0
      - name: Check YAML
        run: >-
          yamllint -d '{extends: default, rules: {line-length: disable}}'
          bootstrap infrastructure/ansible platform environments
      - name: Check Ansible style
        run: ansible-lint infrastructure/ansible
      - name: Check Ansible syntax
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/infrastructure/ansible/ansible.cfg
        run: >-
          ansible-playbook --syntax-check --inventory localhost,
          infrastructure/ansible/playbooks/bootstrap-k3s.yaml

  helm:
    name: Helm and Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.2
      - name: Lint chart
        run: helm lint charts/hello
      - name: Render staging chart
        run: >-
          helm template hello-staging charts/hello
          --values environments/staging/values.yaml
          > /tmp/hello-staging.yaml
      - name: Render production chart
        run: >-
          helm template hello-production charts/hello
          --values environments/production/values.yaml
          > /tmp/hello-production.yaml
      - name: Render root manifests
        run: kubectl kustomize platform/root > /tmp/platform-root.yaml
