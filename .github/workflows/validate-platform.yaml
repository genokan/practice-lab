name: Validate platform

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "argocd/**"
      - "bootstrap/**"
      - "infrastructure/**"
      - "platform/**"
      - "values/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - run: terraform -chdir=infrastructure/terraform fmt -check
      - run: terraform -chdir=infrastructure/terraform init -backend=false -input=false
      - run: terraform -chdir=infrastructure/terraform validate -no-color
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - run: >-
          go run github.com/terraform-docs/terraform-docs@v0.20.0 markdown table
          --output-file README.md --output-mode replace infrastructure/terraform
      - run: git diff --exit-code -- infrastructure/terraform/README.md

  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validation tools
        run: >-
          python -m pip install --disable-pip-version-check
          ansible-core==2.21.3 ansible-lint==26.8.0 yamllint==1.38.0
      - name: Check YAML
        run: >-
          yamllint -d '{extends: default, rules: {line-length: disable}}'
          bootstrap infrastructure/ansible platform argocd values
      - name: Check Ansible style
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/infrastructure/ansible/ansible.cfg
        run: ansible-lint infrastructure/ansible/playbooks infrastructure/ansible/roles
      - name: Check Ansible syntax
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/infrastructure/ansible/ansible.cfg
        run: >-
          ansible-playbook --syntax-check --inventory localhost,
          infrastructure/ansible/playbooks/bootstrap-k3s.yaml

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.2
      - run: kubectl kustomize platform/root > /tmp/platform-root.yaml
