name: Validate application

on:
  pull_request:
    paths:
      - ".github/workflows/validate-application.yaml"
      - "apps/hello-elixir/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hello-elixir
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2.4"
          elixir-version: "1.18.4"
      - name: Restore Mix dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            apps/hello-elixir/deps
            apps/hello-elixir/_build
          key: mix-${{ runner.os }}-otp-27.2.4-elixir-1.18.4-${{ hashFiles('apps/hello-elixir/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-otp-27.2.4-elixir-1.18.4-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test
