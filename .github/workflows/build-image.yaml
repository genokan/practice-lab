name: Build hello-api image

on:
  push:
    branches: [main]
    paths:
      - "apps/hello-api/**"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: apps/hello-api
          push: true
          platforms: linux/arm64
          build-args: APP_VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}/hello-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=hello-api-arm64
          cache-to: type=gha,mode=max,scope=hello-api-arm64

  update-staging-release:
    name: Open staging image update PR
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/hello-api
      SOURCE_REVISION: ${{ github.sha }}
      RELEASE_FILE: gitops/releases/hello-api-staging.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: mikefarah/yq@v4.45.4
      - name: Select the immutable image for staging
        run: >-
          yq -i
          '.image.repository = strenv(IMAGE_REPOSITORY) |
          .image.digest = strenv(IMAGE_DIGEST) |
          .image.sourceRevision = strenv(SOURCE_REVISION)'
          "$RELEASE_FILE"
      - name: Open a staging desired-state pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/staging-hello-api-image
          delete-branch: true
          commit-message: "chore(gitops): update staging hello-api image"
          title: "chore(gitops): update staging hello-api image"
          body: >-
            Selects the immutable hello-api image built from
            `${{ github.sha }}` for staging. Argo deploys it only after this PR merges.
          add-paths: ${{ env.RELEASE_FILE }}
