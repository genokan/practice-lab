name: Build hello-elixir image

on:
  push:
    branches: [main]
    paths:
      - "apps/hello-elixir/**"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/hello-elixir
          push: true
          platforms: linux/arm64
          build-args: APP_VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}/hello-elixir:sha-${{ github.sha }}
          cache-from: type=gha,scope=hello-elixir-arm64
          cache-to: type=gha,mode=max,scope=hello-elixir-arm64
