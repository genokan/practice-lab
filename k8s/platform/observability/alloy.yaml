---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.12.1
    helm:
      releaseName: alloy
      values: |
        controller:
          type: daemonset
        alloy:
          mounts:
            varlog: true
          enableReporting: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          configMap:
            content: |
              local.file_match "pods" {
                path_targets = [{"__path__" = "/var/log/pods/*/*/*.log"}]
                sync_period = "10s"
              }

              loki.process "pods" {
                forward_to = [loki.write.homelab.receiver]

                stage.cri {}

                stage.regex {
                  source     = "filename"
                  expression = "^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/.*$"
                }

                stage.labels {
                  values = {
                    namespace = "",
                    pod       = "",
                    container = "",
                  }
                }

                stage.static_labels {
                  values = {
                    cluster = "practice-lab",
                  }
                }
              }

              loki.source.file "pods" {
                targets    = local.file_match.pods.targets
                forward_to = [loki.process.pods.receiver]
              }

              loki.write "homelab" {
                endpoint {
                  url = "http://192.168.4.10:3100/loki/api/v1/push"
                }
              }

              prometheus.scrape "kube_state_metrics" {
                targets = [{
                  "__address__" = "kube-state-metrics.observability.svc.cluster.local:8080",
                  "cluster"     = "practice-lab",
                  "job"         = "kube-state-metrics",
                }]
                forward_to = [prometheus.remote_write.homelab.receiver]
              }

              // The application chart marks its Pods with app.kubernetes.io/name=hello-api
              // and exposes port 4000. Scrape only those Pods every 10 seconds: broad
              // annotation-based discovery would make every future workload an implicit
              // metrics target.
              discovery.kubernetes "hello_api" {
                role = "pod"

                namespaces {
                  names = ["hello-staging", "hello-prod"]
                }

                selectors {
                  role  = "pod"
                  label = "app.kubernetes.io/name=hello-api"
                }
              }

              discovery.relabel "hello_api_metrics" {
                targets = discovery.kubernetes.hello_api.targets

                rule {
                  source_labels = ["__meta_kubernetes_pod_phase"]
                  regex         = "Running"
                  action        = "keep"
                }

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }

                rule {
                  target_label = "cluster"
                  replacement  = "practice-lab"
                }

                rule {
                  target_label = "job"
                  replacement  = "hello-api"
                }
              }

              prometheus.scrape "hello_api" {
                targets         = discovery.relabel.hello_api_metrics.output
                scrape_interval = "10s"
                forward_to      = [prometheus.remote_write.homelab.receiver]
              }

              // cAdvisor comes from the kubelet. Keep only hello-api containers so
              // this lab gains CPU, throttling, and memory evidence without making
              // every cluster workload an implicit Prometheus target.
              discovery.kubernetes "kubelets" {
                role = "node"
              }

              discovery.relabel "kubelet_cadvisor" {
                targets = discovery.kubernetes.kubelets.targets

                rule {
                  source_labels = ["__meta_kubernetes_node_address_InternalIP"]
                  regex         = "(.+)"
                  target_label  = "__address__"
                  replacement   = "$1:10250"
                }

                rule {
                  target_label = "__metrics_path__"
                  replacement  = "/metrics/cadvisor"
                }
              }

              prometheus.relabel "hello_api_cadvisor" {
                forward_to = [prometheus.remote_write.homelab.receiver]

                rule {
                  source_labels = ["namespace"]
                  regex         = "hello-(staging|prod)"
                  action        = "keep"
                }

                rule {
                  source_labels = ["container"]
                  regex         = "hello"
                  action        = "keep"
                }

                rule {
                  target_label = "cluster"
                  replacement  = "practice-lab"
                }

                rule {
                  target_label = "job"
                  replacement  = "kubelet-cadvisor"
                }
              }

              prometheus.scrape "kubelet_cadvisor" {
                targets           = discovery.relabel.kubelet_cadvisor.output
                scrape_interval   = "10s"
                scheme            = "https"
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                tls_config {
                  insecure_skip_verify = true
                }
                forward_to = [prometheus.relabel.hello_api_cadvisor.receiver]
              }

              prometheus.remote_write "homelab" {
                endpoint {
                  url = "http://192.168.4.10:9090/api/v1/write"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
