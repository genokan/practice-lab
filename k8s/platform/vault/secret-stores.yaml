---
# SecretStore is intentionally namespace-scoped.  A staging ExternalSecret can
# authenticate only as the staging service account and can read only staging paths.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: hello-staging
spec:
  provider:
    vault:
      server: https://vault.opsguy.io
      path: practice-lab-kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes-practice-lab
          role: eso-staging
          serviceAccountRef:
            name: vault-secrets
            audiences:
              - vault://hello-staging/vault-secret-store
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: hello-prod
spec:
  provider:
    vault:
      server: https://vault.opsguy.io
      path: practice-lab-kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes-practice-lab
          role: eso-prod
          serviceAccountRef:
            name: vault-secrets
            audiences:
              - vault://hello-prod/vault-secret-store
