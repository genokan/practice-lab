environment: production
image:
  repository: ghcr.io/genokan/practice-hello-api
  tag: ""
  digest: sha256:02519440c75d2e5b298326f40d5cd10d8c5bf4315ea394bcb7acdcc4616dddef
  pullPolicy: IfNotPresent
service:
  targetPort: 4000
# Production is deployed and observable, but remains intentionally private until a
# Caddy route and DNS name are added for it.
ingress:
  enabled: false
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "4000"
