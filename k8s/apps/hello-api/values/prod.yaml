environment: production

image:
  repository: ghcr.io/genokan/practice-hello-api
  tag: ""
  digest: sha256:2e18f58a7060c004a6d0973458be335c3e794d47c08522c8c418fc878ee1b73b
  pullPolicy: IfNotPresent

service:
  targetPort: 4000

# Production is deployed and observable, but remains intentionally private until a
# Caddy route and DNS name are added for it.
ingress:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "4000"
