environment: staging
replicaCount: 2
lab:
  enabled: true
  maxDurationSeconds: 300
  maxLatencyMilliseconds: 5000
image:
  repository: ghcr.io/genokan/practice-hello-api
  tag: ""
  digest: sha256:b8102195ffbde7f68583ef8ee1f85e403bcb3fbf0f8080b161dac2b1ba3305be
  pullPolicy: IfNotPresent
service:
  targetPort: 4000
ingress:
  enabled: true
  host: hello-staging.opsguy.io
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "4000"
