environment: staging
replicaCount: 2
lab:
  enabled: true
  maxDurationSeconds: 300
  maxLatencyMilliseconds: 5000
  maxCpuWorkers: 8
  maxMemoryMiB: 512
load:
  enabled: true
  ui:
    enabled: true
  targetUrl: http://hello-api-staging-hello-api
failureExercises:
  enabled: true
image:
  repository: ghcr.io/genokan/practice-hello-api
  tag: ""
  digest: sha256:7400f1099f31d30e75479da9112de89fb081253b547832efc9e41f9fef406234
  pullPolicy: IfNotPresent
service:
  targetPort: 4000
ingress:
  enabled: true
  host: hello-staging.opsguy.io
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
podDisruptionBudget:
  enabled: true
  minAvailable: 1
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "4000"
