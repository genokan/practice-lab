apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hello-api
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - application: hello-api-staging
            namespace: hello-staging
            releaseName: hello-api-staging
            valuesFile: k8s/apps/hello-api/values/staging.yaml
            chartRevision: sha256:de82a9604cdf8b3251c18398bbfe64f3a38ea16de2fda7383b1a0aa9c6eb5dbb
          - application: hello-api-prod
            namespace: hello-prod
            releaseName: hello-api-prod
            valuesFile: k8s/apps/hello-api/values/prod.yaml
            chartRevision: sha256:642e07e5d794ef50d8e45a067a8060b241850658ece9ff1c5f180d36d75ba22f
  template:
    metadata:
      name: '{{ .application }}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: oci://ghcr.io/genokan/practice-hello-api/charts/hello-api
          targetRevision: '{{ .chartRevision }}'
          path: .
          helm:
            releaseName: '{{ .releaseName }}'
            valueFiles:
              - '$values/{{ .valuesFile }}'
        - repoURL: https://github.com/genokan/practice-lab.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
